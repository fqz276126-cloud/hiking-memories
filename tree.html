<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#06120f" />
<meta name="description" content="山野回忆树：把徒步照片变成可以聚散、旋转与手势控制的粒子圣诞树。" />
<title>山野回忆树 · 粒子与徒步记忆</title>
<style>
  :root {
    --bg: #06120f; --ink: #f4f0df; --muted: #9aad9e; --gold: #e9c47a;
    --forest: #4bbd88; --sage: #8df7c4; --warm: #ffb469; --line: rgba(233, 196, 122, .24);
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  button, a { font: inherit; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  canvas#scene { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  canvas#scene:active { cursor: grabbing; }
  .topbar { position: fixed; z-index: 8; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 22px 26px; pointer-events: none; }
  .topbar > * { pointer-events: auto; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .back { color: var(--muted); text-decoration: none; font-size: 12px; white-space: nowrap; }
  .back:hover { color: var(--gold); }
  .brand-name { font-size: 15px; letter-spacing: .18em; white-space: nowrap; }
  .brand-sub { margin-top: 3px; color: var(--muted); font-size: 8px; letter-spacing: .25em; }
  .controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
  .control-button { min-height: 36px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); background: rgba(5, 18, 14, .68); backdrop-filter: blur(14px); cursor: pointer; font-size: 11px; letter-spacing: .06em; transition: background .2s, border-color .2s; }
  .control-button:hover, .control-button:focus-visible { border-color: var(--gold); outline: none; }
  .control-button.active { color: #10241c; border-color: var(--gold); background: var(--gold); }
  .control-button.gesture { border-color: rgba(141, 247, 196, .35); color: var(--sage); }
  .control-button:disabled { opacity: .6; cursor: wait; }
  .hint { position: fixed; z-index: 7; left: 26px; bottom: 24px; max-width: 410px; padding: 13px 16px; border: 1px solid rgba(233, 196, 122, .16); border-radius: 12px; color: var(--muted); background: rgba(5, 18, 14, .55); backdrop-filter: blur(12px); font-size: 11px; line-height: 1.9; pointer-events: none; }
  .hint strong { display: block; margin-bottom: 3px; color: var(--ink); font-weight: 500; letter-spacing: .1em; }
  .status { position: fixed; z-index: 8; top: 78px; right: 26px; padding: 7px 12px; border: 1px solid rgba(141, 247, 196, .22); border-radius: 999px; color: var(--sage); background: rgba(5, 18, 14, .62); font-size: 10px; letter-spacing: .08em; pointer-events: none; }
  .photo-layer { position: fixed; z-index: 4; inset: 0; pointer-events: none; overflow: hidden; }
  .photo-chip { position: absolute; display: block; padding: 4px 4px 13px; border: 0; border-radius: 2px; background: #f5efe0; box-shadow: 0 7px 22px rgba(0, 0, 0, .5), 0 0 18px rgba(233, 196, 122, .18); cursor: pointer; pointer-events: auto; will-change: left, top, width, transform; }
  .photo-chip::before { content: ""; position: absolute; left: 50%; top: -4px; width: 8px; height: 8px; transform: translateX(-50%); border-radius: 50%; background: var(--gold); box-shadow: 0 0 9px rgba(233, 196, 122, .8); }
  .photo-chip img, .photo-chip video { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #10231d; }
  .photo-chip:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .focus-card { position: fixed; z-index: 9; left: 50%; top: 50%; display: grid; grid-template-columns: minmax(220px, 42vw) minmax(220px, 300px); gap: 0; width: min(820px, calc(100vw - 40px)); max-height: calc(100vh - 100px); transform: translate(-50%, -50%); overflow: hidden; border: 1px solid rgba(233, 196, 122, .16); border-radius: 18px; color: var(--ink); background: transparent; box-shadow: 0 24px 90px rgba(0, 0, 0, .45), 0 0 60px rgba(23, 20, 50, .35); animation: focus-pop .38s ease; }
  @keyframes focus-pop { from { transform: translate(-50%, -50%) scale(.88); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
  .focus-card img, .focus-card video { display: block; width: 100%; height: 100%; min-height: 340px; max-height: 62vh; object-fit: cover; }
  .focus-content { position: relative; padding: 34px 26px; overflow: auto; background: rgba(5, 13, 12, .42); backdrop-filter: blur(16px); }
  .focus-date { color: var(--gold); font-size: 10px; letter-spacing: .14em; }
  .focus-content h2 { margin: 12px 0 8px; font-family: "Songti SC", "STSong", serif; font-size: 28px; font-weight: 500; }
  .focus-place { color: var(--muted); font-size: 12px; }
  .focus-note { margin: 25px 0; color: #c8d7cb; font-size: 12px; line-height: 2; white-space: pre-wrap; }
  .focus-route { padding-top: 14px; border-top: 1px solid rgba(233, 196, 122, .18); color: var(--muted); font-size: 11px; }
  .focus-actions { display: flex; gap: 8px; margin-top: 24px; }
  .focus-actions .control-button { border-radius: 10px; }
  .camera-preview { position: fixed; z-index: 8; right: 26px; bottom: 24px; width: 132px; height: 99px; border: 1px solid rgba(233, 196, 122, .32); border-radius: 12px; object-fit: cover; background: #0a1d17; transform: scaleX(-1); box-shadow: 0 12px 40px rgba(0, 0, 0, .4); }
  .hand-cursor { position: fixed; z-index: 10; width: 20px; height: 20px; margin: -10px 0 0 -10px; border: 1px solid var(--sage); border-radius: 50%; box-shadow: 0 0 14px rgba(141, 247, 196, .7); pointer-events: none; }
  .hand-cursor::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--sage); }
  .toast { position: fixed; z-index: 20; left: 50%; bottom: 92px; max-width: calc(100vw - 32px); transform: translateX(-50%); padding: 11px 17px; border: 1px solid rgba(233, 196, 122, .34); border-radius: 999px; color: #fff0d2; background: rgba(5, 18, 14, .94); box-shadow: 0 12px 40px rgba(0, 0, 0, .4); font-size: 12px; text-align: center; pointer-events: none; }
  @media (max-width: 700px) {
    .topbar { align-items: flex-start; padding: 14px; flex-direction: column; gap: 10px; }
    .controls { justify-content: flex-start; }
    .control-button { min-height: 33px; padding: 0 10px; font-size: 10px; }
    .status { top: auto; right: 14px; bottom: 154px; }
    .hint { left: 14px; right: 14px; bottom: 14px; max-width: none; padding: 10px 12px; font-size: 10px; }
    .camera-preview { right: 14px; bottom: 112px; width: 92px; height: 69px; }
    .focus-card { grid-template-columns: 1fr; width: calc(100vw - 24px); max-height: calc(100vh - 130px); overflow: auto; }
    .focus-card img, .focus-card video { height: 35vh; min-height: 220px; max-height: none; }
    .focus-content { padding: 22px 20px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="topbar" id="topbar">
  <div class="brand">
    <a class="back" href="index.html">← 返回记忆馆</a>
    <div><div class="brand-name">山野回忆树</div><div class="brand-sub">PARTICLE MEMORY TREE</div></div>
  </div>
  <div class="controls">
    <button class="control-button active" data-mode="TREE" type="button">聚成树</button>
    <button class="control-button" data-mode="SCATTER" type="button">散成星野</button>
    <button class="control-button" data-mode="FOCUS" type="button">聚焦照片</button>
    <button class="control-button gesture" id="gestureButton" type="button">启用手势</button>
    <button class="control-button" id="musicButton" type="button">播放音乐</button>
  </div>
</div>
<div class="status" id="status">鼠标与触控模式</div>
<div class="hint" id="hint">
  <strong>把走过的山，聚成一棵树</strong>
  拖拽旋转，滚轮缩放，点击照片进入聚焦。按 1 / 2 / 3 切换模式，H 隐藏界面。<br />
  启用摄像头后：握拳聚拢，张手散开；比 ✌️ 放大离手最近的照片，左右挥手切换回忆，握拳返回树形。
</div>
<div class="photo-layer" id="photoLayer"></div>

<section class="focus-card" id="focusCard" aria-label="聚焦的徒步回忆" hidden>
  <img id="focusImage" alt="聚焦的徒步照片" />
  <video id="focusVideo" controls loop playsinline hidden></video>
  <div class="focus-content">
    <div class="focus-date" id="focusDate"></div>
    <h2 id="focusTitle"></h2>
    <div class="focus-place" id="focusPlace"></div>
    <p class="focus-note" id="focusNote"></p>
    <div class="focus-route" id="focusRoute"></div>
    <div class="focus-actions">
      <button class="control-button" id="focusPrevious" type="button">上一张</button>
      <button class="control-button" id="focusNext" type="button">下一张</button>
      <button class="control-button" id="focusClose" type="button">回到树形</button>
    </div>
  </div>
</section>

<video class="camera-preview" id="webcam" autoplay playsinline muted hidden></video>
<div class="hand-cursor" id="handCursor" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<audio id="bgm" src="music/episode33.mp3" loop preload="auto"></audio>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  // 云端配置（WorkBuddy 云服务公开配置，所有访客只读同一份回忆）
  const cloud = window.WorkBuddyCloud ? WorkBuddyCloud.createWorkBuddyCloud({
    endpoint: "https://hiking-memories-70794.app.workbuddy.host",
    oauthRelayBaseUrl: "https://www.workbuddy.cn/v2/as/genie-baas/oauth",
    publishableKey: "wbpk_Eyw8KsG6CLfrEDCcyFQ6TW_fFF2J412eW0000AY5wZg2dsdZEMdZ4iT"
  }) : null;
  const canvas = $("scene");
  const ctx = canvas.getContext("2d");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const state = {
    mode: "TREE", memories: [], shownPhotos: [], photoPositions: [], focusIndex: 0,
    rot: 0, rotationVelocity: 0, zoom: 1, dragging: false, lastPointerX: 0,
    gestureActive: false, gestureRecognizer: null, stream: null, lastVideoTime: -1,
    lastGesture: "", gestureCounter: 0, lastModeTime: 0, lastEffectTime: 0,
    interfaceHidden: false, toastTimer: null, photoScreenXs: [], lastGestureSwitch: 0,
    handTrail: [], swipeArmed: true
  };

  let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, treeH = 0, baseR = 0, focal = 1;
  let particles = [], bgStars = [], sparks = [], photoObjectUrls = [], motes = [], canopyTips = [];

  // 徒步美感语录：未填写心情时，按回忆稳定分配一句（同一回忆每次打开都是同一句）
  const HIKE_QUOTES = [
    "山不见我，我自去见山。",
    "那天的山风和脚步，都留在这里。",
    "一步一步，把日子走成风景。",
    "风从山上来，带着自由的味道。",
    "山在那里，路在脚下。",
    "走得越远，离自己越近。",
    "山顶的风景，只对坚持的人可见。",
    "慢下来，山野会告诉你答案。",
    "每一步都算数，每一帧都值得。",
    "去山里，把心事走成云海。",
    "山高路远，步履不停。",
    "与山野相遇的每一天，都是好日子。",
    "云在肩上，风在耳边，路在脚下。",
    "走过四季山川，收藏人间浪漫。",
    "山风知我意，吹梦到山巅。",
    "一路向前，山海皆温柔。"
  ];
  function quoteFor(memory) {
    let hash = 0;
    const key = String((memory && (memory.id || memory.title)) || "");
    for (let i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
    return HIKE_QUOTES[hash % HIKE_QUOTES.length];
  }
  function isVideoMemory(memory) {
    if (memory.mediaType) return /^video\//i.test(memory.mediaType);
    if (memory.blob && memory.blob.type) return /^video\//i.test(memory.blob.type);
    return /^data:video\//i.test(memory.src || "") || /\.(mp4|webm|mov)(\?|#|$)/i.test(memory.src || "");
  }
  let bgGrad = null, floorGrad = null, vignette = null, dbPromise = null;
  const spriteCache = {};
  const palette = {
    forest: "#1c9e6c", green: "#4bbd88", sage: "#8df7c4", gold: "#e9c47a",
    warm: "#ffb469", ice: "#dff3ff", red: "#ff7f8f", blue: "#93d8ff",
    teal: "#2fe0b8", deep: "#143c30"
  };

  function showToast(message, duration = 3400) {
    clearTimeout(state.toastTimer);
    $("toast").textContent = message;
    $("toast").hidden = false;
    state.toastTimer = setTimeout(() => { $("toast").hidden = true; }, duration);
  }

  function formatDate(date) {
    if (!date) return "日期待补充";
    const parts = date.split("-");
    return `${parts[0]} 年 ${Number(parts[1])} 月 ${Number(parts[2])} 日`;
  }

  function makeSprite(hex) {
    if (spriteCache[hex]) return spriteCache[hex];
    const size = 64;
    const sprite = document.createElement("canvas");
    sprite.width = size; sprite.height = size;
    const context = sprite.getContext("2d");
    const h = hex.replace("#", "");
    const n = parseInt(h.length === 3 ? h.split("").map(character => character + character).join("") : h, 16);
    const rgb = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    const gradient = context.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    gradient.addColorStop(0, "rgba(255,255,255,0.76)");
    gradient.addColorStop(.1, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},.92)`);
    gradient.addColorStop(.38, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},.32)`);
    gradient.addColorStop(1, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},0)`);
    context.fillStyle = gradient;
    context.fillRect(0, 0, size, size);
    spriteCache[hex] = sprite;
    return sprite;
  }

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error("IndexedDB unavailable"));
      const request = indexedDB.open("hiking-memories-v1", 1);
      request.onupgradeneeded = () => {
        const db = request.result;
        if (!db.objectStoreNames.contains("memories")) db.createObjectStore("memories", { keyPath: "id" });
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
    return dbPromise;
  }

  async function withStore(mode, operation) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const transaction = db.transaction("memories", mode);
      const request = operation(transaction.objectStore("memories"));
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function loadBundledPhotos() {
    try {
      const response = await fetch("photos.json", { cache: "no-store" });
      if (!response.ok) return [];
      const entries = await response.json();
      if (!Array.isArray(entries)) return [];
      return entries.map((entry, index) => {
        if (!entry) return null;
        const raw = typeof entry === "string" ? entry : entry.src || entry.file;
        if (!raw) return null;
        let src = raw;
        if (!/^(https?:|data:|blob:|\/)/i.test(src) && !src.startsWith("photos/")) src = `photos/${src}`;
        return {
          id: `bundled-${index}`, src, custom: false, title: entry.title || "山野回忆",
          location: entry.location || "", date: entry.date || "", distance: entry.distance || "",
          note: entry.note || "", createdAt: index
        };
      }).filter(Boolean);
    } catch (error) {
      return [];
    }
  }

  async function loadCustomPhotos() {
    try {
      const records = await withStore("readonly", store => store.getAll());
      return records.map(record => {
        const src = URL.createObjectURL(record.blob);
        photoObjectUrls.push(src);
        return { ...record, src, custom: true };
      });
    } catch (error) {
      return [];
    }
  }

  async function loadCloudPhotos() {
    if (!cloud) return [];
    const { data, error } = await cloud.database.from("memories")
      .select("id, title, location, date, distance, note, image_data, media_type, created_at_ms")
      .order("created_at_ms", { ascending: false }).limit(500);
    if (error) throw error;
    return (data || []).map(row => ({
      id: row.id, src: row.image_data, custom: true, cloud: true,
      mediaType: row.media_type || (/^data:video\//i.test(row.image_data || "") ? "video/mp4" : "image"),
      title: row.title || "山野回忆", location: row.location || "", date: row.date || "",
      distance: row.distance || "", note: row.note || "", createdAt: Number(row.created_at_ms) || 0
    }));
  }

  function tripKeyOf(memory) {
    return JSON.stringify([memory.title || "", memory.date || "", memory.location || "", memory.distance || "", memory.note || ""]);
  }

  async function loadPhotos() {
    const results = await Promise.allSettled([loadBundledPhotos(), loadCustomPhotos(), loadCloudPhotos()]);
    const bundled = results[0].status === "fulfilled" ? results[0].value : [];
    const local = results[1].status === "fulfilled" ? results[1].value : [];
    const cloudFailed = results[2].status === "rejected";
    const cloudPhotos = cloudFailed ? [] : results[2].value;
    if (cloudFailed) showToast("云端暂时连接不上，先展示本机已有的照片", 4600);
    // 云端优先，本地未同步的补充在后面，按 id 去重
    const seen = new Set();
    state.memories = bundled.concat(cloudPhotos, local).filter(memory => {
      if (seen.has(memory.id)) return false;
      seen.add(memory.id);
      return true;
    }).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (a.createdAt || 0) - (b.createdAt || 0));
    // 从记忆馆带 ?trip= 进入时，只展示这一段旅程的照片
    const tripParam = new URLSearchParams(location.search).get("trip");
    if (tripParam) {
      const filtered = state.memories.filter(memory => tripKeyOf(memory) === tripParam);
      if (filtered.length) {
        state.memories = filtered;
        state.tripTitle = filtered[0].title || "这段旅程";
        showToast(`回忆树正在展示「${state.tripTitle}」的 ${filtered.length} 张照片`, 4200);
      } else {
        showToast("没有找到这段旅程，展示全部照片", 4200);
      }
    }
    renderPhotoChips();
    if (!state.memories.length) $("status").textContent = "还没有照片，先到记忆馆添加回忆";
  }

  function renderPhotoChips() {
    const total = state.memories.length;
    // 照片变多就多挂一些（桌面最多 14 张、手机最多 9 张），并保持主枝大图、侧枝小图的错落
    const limit = W < 600
      ? Math.min(9, Math.max(5, Math.ceil(total * .45)))
      : Math.min(14, Math.max(8, Math.ceil(total * .6)));
    state.shownPhotos = state.memories.slice(0, limit);
    // 照片光点沿枝梢自然分布：外层明亮枝梢承载高光回忆，内层弱光安放沿途随拍；
    // 只用树冠区域的枝梢（低垂近地的枝梢不挂照片，避免飘到树外）
    const inCanopy = tip => tip.y < treeH * .1;
    const bigTips = canopyTips.filter(tip => tip.big && inCanopy(tip));
    const smallTips = canopyTips.filter(tip => !tip.big && inCanopy(tip));
    const byAngle = list => list.map(tip => ({ tip, a: Math.atan2(tip.z, tip.x) })).sort((x, y) => x.a - y.a);
    const bigSorted = byAngle(bigTips.length ? bigTips : canopyTips);
    const smallSorted = byAngle(smallTips.length ? smallTips : (bigTips.length ? bigTips : canopyTips));
    const bigCount = Math.min(Math.max(1, Math.ceil(state.shownPhotos.length / 3)), state.shownPhotos.length);
    // 挑选枝梢：最远优先采样保证分布均匀，并在多个旋转角度下做屏幕投影间距检查——
    // 树会缓慢自转，旋转中短暂掠过属自然，但常态视角下要保持间距；
    // 枝梢紧张时自动放宽阈值，优先保证不重复、尽量散开
    const rotSamples = [-1.2, -.6, 0, .6, 1.2].map(a => ({ cos: Math.cos(state.rot + a), sin: Math.sin(state.rot + a) }));
    const chosenPts = [], usedTips = new Set();
    const pickSpaced = (sorted, count) => {
      const out = [];
      let threshold = treeH * .12, relaxations = 0;
      const floorT = treeH * .085;
      const skipped = new Set();
      const projAt = (tip, r) => project(tip.x, tip.y, tip.z, r.cos, r.sin);
      while (out.length < count) {
        const candidates = sorted.map(e => e.tip).filter(t => !usedTips.has(t) && !skipped.has(t));
        if (!candidates.length) {
          if (skipped.size && relaxations < 3 && threshold > floorT) {
            skipped.clear(); threshold = Math.max(threshold * .78, floorT); relaxations++; continue;
          }
          break;
        }
        // farthest-first：选与已选集合当前视角距离最远的枝梢
        let best = null, bestD = -1;
        for (const cand of candidates) {
          const pr = projAt(cand, rotSamples[2]);
          const d = chosenPts.length
            ? Math.min(...chosenPts.map(p => Math.hypot(p[2].sx - pr.sx, p[2].sy - pr.sy)))
            : 1;
          if (d > bestD) { bestD = d; best = cand; }
        }
        const prs = rotSamples.map(r => projAt(best, r));
        let gap = Infinity;
        for (const p of chosenPts) for (let ri = 0; ri < rotSamples.length; ri++) {
          const g = Math.hypot(p[ri].sx - prs[ri].sx, p[ri].sy - prs[ri].sy);
          if (g < gap) gap = g;
        }
        if (gap >= threshold) { out.push(best); usedTips.add(best); chosenPts.push(prs); }
        else skipped.add(best);
      }
      // 兜底：枝梢用尽仍未凑满时，选与已选集合距离最大的枝梢（允许重叠但尽量散开）
      while (out.length < count && sorted.length) {
        let best = null, bestD = -1;
        for (const entry of sorted) {
          const cand = entry.tip;
          const pr = projAt(cand, rotSamples[2]);
          const d = chosenPts.length
            ? Math.min(...chosenPts.map(p => Math.hypot(p[2].sx - pr.sx, p[2].sy - pr.sy)))
            : 1;
          if (d > bestD) { bestD = d; best = cand; }
        }
        if (!best) break;
        out.push(best);
        chosenPts.push(rotSamples.map(r => projAt(best, r)));
      }
      return out;
    };
    const chosenBig = pickSpaced(bigSorted, bigCount);
    const chosenSmall = pickSpaced(smallSorted, state.shownPhotos.length - chosenBig.length);
    const jitter = () => (Math.random() - .5) * treeH * .028;
    state.photoPositions = state.shownPhotos.map((memory, index) => {
      const onBig = index < chosenBig.length;
      const tip = onBig
        ? chosenBig[index]
        : (chosenSmall[index - chosenBig.length] || chosenBig[index % Math.max(chosenBig.length, 1)] || null);
      const treePos = tip
        ? { x: tip.x + jitter(), y: tip.y + jitter(), z: tip.z + jitter() }
        : { x: 0, y: 0, z: 0 };
      return {
        tree: treePos,
        sizeFactor: tip ? (onBig ? 1.12 : .88) : 1,
        scatter: {
          x: (Math.sin(index * 12.9898) * .5) * treeH * 2.1,
          y: (Math.cos(index * 7.233) * .5) * treeH * 1.3,
          z: (Math.sin(index * 3.141 + 1.7) * .5) * treeH * 1.4
        }
      };
    });
    const layer = $("photoLayer");
    layer.textContent = "";
    state.shownPhotos.forEach((memory, index) => {
      const button = document.createElement("button");
      button.className = "photo-chip";
      button.type = "button";
      button.setAttribute("aria-label", `聚焦 ${memory.title}`);
      const image = isVideoMemory(memory)
        ? (() => {
            const video = document.createElement("video");
            video.src = memory.src + "#t=0.1";
            video.muted = true; video.loop = true; video.playsInline = true;
            video.preload = "metadata"; video.setAttribute("playsinline", "");
            return video;
          })()
        : (() => {
            const img = document.createElement("img");
            img.src = memory.src;
            img.alt = memory.title;
            img.draggable = false;
            return img;
          })();
      button.appendChild(image);
      button.addEventListener("click", () => {
        state.focusIndex = index;
        setMode("FOCUS", true);
      });
      layer.appendChild(button);
    });
    updatePhotoChips();
  }

  function buildScene() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    treeH = Math.min(H * .88, W * 1.2);
    baseR = treeH * .31;
    cx = W / 2;
    cy = H * .52;
    focal = treeH * 1.7;

    // 深色山野星空背景：上方深墨绿到蓝紫渐变，向地平线沉入暗色
    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, "#171432");
    bgGrad.addColorStop(.38, "#101d2b");
    bgGrad.addColorStop(.62, "#0b1b17");
    bgGrad.addColorStop(1, "#050d0b");
    floorGrad = ctx.createRadialGradient(cx, cy + treeH * .5, 0, cx, cy + treeH * .5, baseR * 2.7);
    floorGrad.addColorStop(0, "rgba(47,224,184,.26)");
    floorGrad.addColorStop(.4, "rgba(35,140,110,.1)");
    floorGrad.addColorStop(1, "rgba(0,0,0,0)");
    vignette = ctx.createRadialGradient(cx, H * .5, Math.min(W, H) * .3, cx, H * .5, Math.max(W, H) * .8);
    vignette.addColorStop(0, "rgba(0,0,0,0)");
    vignette.addColorStop(1, "rgba(0,0,0,.72)");

    // 极少量细小星尘，只分布在天空区域，低亮度不抢前景
    bgStars = Array.from({ length: Math.min(90, Math.round(W * H / 24000)) }, () => ({
      x: Math.random() * W, y: Math.random() * H * .78, r: .3 + Math.random() * .8,
      tw: Math.random() * Math.PI * 2, sp: .5 + Math.random() * 1.7, alpha: .14 + Math.random() * .34
    }));

    const count = W < 600 ? 2000 : 3200;
    particles = [];
    canopyTips = [];
    const scatterPos = () => ({
      x: (Math.random() - .5) * treeH * 2.6,
      y: (Math.random() - .5) * treeH * 1.7,
      z: (Math.random() - .5) * treeH * 1.8
    });
    const addParticle = (tree, options) => {
      const scatter = scatterPos();
      particles.push({
        x: scatter.x, y: scatter.y, z: scatter.z, tree, scatter,
        color: options.color, size: options.size, light: Boolean(options.light),
        tw: Math.random() * Math.PI * 2, alpha: options.alpha
      });
    };

    const leafColor = () => Math.random() < .5 ? palette.sage : (Math.random() < .72 ? palette.green : palette.ice);

    // 1) 树干：苍劲挺拔的暗色实体，缀青色微光脉络
    const trunkSamples = Math.round(count * .12);
    for (let i = 0; i < trunkSamples; i++) {
      const t = Math.random();
      const y = treeH * .48 - t * treeH * .68;
      const r = treeH * (.075 - .035 * t) * (0.25 + Math.random() * .95);
      const a = Math.random() * Math.PI * 2;
      const vein = Math.random() < .3;
      addParticle({ x: Math.cos(a) * r, y, z: Math.sin(a) * r }, {
        color: vein ? palette.teal : palette.deep,
        size: vein ? 1.2 : 2.8 + Math.random() * 1.2,
        alpha: vein ? .95 : .98
      });
    }

    // 2) 伞状主枝与侧枝：低枝长而舒展，高枝短而上扬，枝梢微垂
    const MAIN_BRANCHES = W < 600 ? 5 : 7;
    const branchPoint = (angle, startY, length, s, riseK, droopK, curve) => {
      const r = treeH * .018 + length * s;
      const bend = angle + Math.sin(s * Math.PI) * curve;
      const y = startY - length * riseK * Math.sin(Math.PI * s * .8) + length * droopK * s * s;
      return { x: Math.cos(bend) * r, y, z: Math.sin(bend) * r };
    };
    for (let k = 0; k < MAIN_BRANCHES; k++) {
      const angle = k * (Math.PI * 2 / MAIN_BRANCHES) + .38 + (Math.random() - .5) * .18;
      const startY = treeH * (.14 - k * .08);
      const length = treeH * (.56 - k * .026) * (.93 + Math.random() * .12);
      const curve = (k % 2 ? .12 : -.12) + (Math.random() - .5) * .06;
      for (let i = 0; i < 36; i++) {
        const s = i / 35;
        const p = branchPoint(angle, startY, length, s, .3, .26, curve);
        addParticle(p, {
          color: Math.random() < .35 ? palette.teal : (Math.random() < .45 ? palette.forest : palette.green),
          size: 1.5, alpha: .9
        });
        // 枝上密叶：枝条后半段点缀荧光小叶，与伞冠衔接
        if (s > .55) {
          for (let m = 0; m < 2; m++) {
            addParticle({
              x: p.x + (Math.random() - .5) * treeH * .045,
              y: p.y + (Math.random() - .5) * treeH * .035,
              z: p.z + (Math.random() - .5) * treeH * .045
            }, { color: leafColor(), size: .8 + Math.random() * .45, alpha: .82 });
          }
        }
      }
      const tip = branchPoint(angle, startY, length, 1, .3, .26, curve);
      canopyTips.push({ x: tip.x, y: tip.y, z: tip.z, big: true });
      for (let j = 0; j < 2; j++) {
        const s0 = .42 + j * .18;
        const base = branchPoint(angle, startY, length, s0, .3, .26, curve);
        const sideAngle = angle + (j ? .62 : -.62) + (Math.random() - .5) * .3;
        const sideLen = length * (.4 + Math.random() * .16);
        for (let i = 0; i < 16; i++) {
          const s = i / 15;
          addParticle({
            x: base.x + Math.cos(sideAngle) * sideLen * s,
            y: base.y - sideLen * .34 * Math.sin(Math.PI * s * .8) + sideLen * .18 * s * s,
            z: base.z + Math.sin(sideAngle) * sideLen * s
          }, {
            color: Math.random() < .35 ? palette.teal : (Math.random() < .5 ? palette.forest : palette.green),
            size: 1.3, alpha: .85
          });
          if (s > .45 && Math.random() < .55) {
            addParticle({
              x: base.x + Math.cos(sideAngle) * sideLen * s + (Math.random() - .5) * treeH * .04,
              y: base.y - sideLen * .34 * Math.sin(Math.PI * s * .8) + sideLen * .18 * s * s + (Math.random() - .5) * treeH * .035,
              z: base.z + Math.sin(sideAngle) * sideLen * s + (Math.random() - .5) * treeH * .04
            }, { color: leafColor(), size: .8 + Math.random() * .4, alpha: .82 });
          }
        }
        const droop = sideLen * .18;
        canopyTips.push({
          x: base.x + Math.cos(sideAngle) * sideLen,
          y: base.y - sideLen * .34 * Math.sin(Math.PI * .8) + droop,
          z: base.z + Math.sin(sideAngle) * sideLen,
          big: false
        });
      }
    }

    // 3) 伞冠体积填充：扁椭球壳层内密布荧光叶粒，上浓下疏，形成连续伞盖
    const glowColors = [palette.gold, palette.warm, palette.ice];
    const crownFill = Math.round(count * .48);
    const crownYc = -treeH * .15, crownRy = treeH * .34, crownRmax = treeH * .55;
    for (let i = 0; i < crownFill; i++) {
      const ny = Math.pow(Math.random(), 1.5) * 2 - 1;
      const y = crownYc + ny * crownRy;
      const section = Math.sqrt(Math.max(0, 1 - ny * ny));
      const a = Math.random() * Math.PI * 2;
      const r = crownRmax * section * (.5 + .5 * Math.pow(Math.random(), .65));
      const px = Math.cos(a) * r, py = y + (Math.random() - .5) * treeH * .03, pz = Math.sin(a) * r;
      if (Math.random() < .045) {
        // 冠中散布的明亮光点，如萤火栖于叶间
        addParticle({ x: px, y: py, z: pz }, {
          color: glowColors[Math.floor(Math.random() * 3)],
          size: 2.6 + Math.random(), light: true, alpha: .93
        });
      } else {
        addParticle({ x: px, y: py, z: pz }, {
          color: leafColor(), size: .85 + Math.random() * .55, alpha: .85
        });
      }
    }

    // 3b) 垂枝：冠层底缘垂落的青绿枝条，末端悬着微光
    const WEEPERS = W < 600 ? 10 : 15;
    for (let i = 0; i < WEEPERS; i++) {
      const a = Math.random() * Math.PI * 2;
      const ny = .15 + Math.random() * .75;
      const y0 = crownYc + ny * crownRy;
      const r0 = crownRmax * Math.sqrt(Math.max(0, 1 - ny * ny)) * (.85 + Math.random() * .2);
      const len = treeH * (.14 + Math.random() * .14);
      for (let sIdx = 0; sIdx < 7; sIdx++) {
        const s = sIdx / 7;
        addParticle({
          x: Math.cos(a) * r0 + Math.sin(s * 3 + i) * treeH * .008,
          y: y0 + len * s,
          z: Math.sin(a) * r0 + Math.cos(s * 2.4 + i) * treeH * .008
        }, { color: Math.random() < .4 ? palette.teal : palette.green, size: .9, alpha: .7 });
      }
      addParticle({ x: Math.cos(a) * r0, y: y0 + len, z: Math.sin(a) * r0 }, {
        color: glowColors[i % 3], size: 2.2 + Math.random() * .8, light: true, alpha: .88
      });
    }

    // 4) 枝梢主光点与垂挂微光：最明亮的大光珠缀在外缘枝梢
    canopyTips.forEach((tip, index) => {
      const lights = tip.big ? 2 + (Math.random() < .5 ? 1 : 0) : (Math.random() < .6 ? 1 : 0);
      for (let i = 0; i < lights; i++) {
        const ox = (Math.random() - .5) * treeH * .07;
        const oy = (Math.random() - .5) * treeH * .05;
        const oz = (Math.random() - .5) * treeH * .07;
        addParticle({ x: tip.x + ox, y: tip.y + oy, z: tip.z + oz }, {
          color: glowColors[(index + i) % glowColors.length],
          size: 3.4 + Math.random() * 1.3, light: true, alpha: .95
        });
        const drops = 2 + Math.floor(Math.random() * 2);
        for (let d = 0; d < drops; d++) {
          addParticle({
            x: tip.x + ox + (Math.random() - .5) * treeH * .012,
            y: tip.y + oy + treeH * (.03 + Math.random() * .07),
            z: tip.z + oz + (Math.random() - .5) * treeH * .012
          }, {
            color: Math.random() < .5 ? palette.sage : palette.ice,
            size: 1.2 + Math.random() * .6, light: true, alpha: .72
          });
        }
      }
    });

    // 5) 地面根脉与草丛微光：沿根脉放射线蔓延的青色光丝
    const groundSamples = Math.round(count * .075);
    for (let i = 0; i < groundSamples; i++) {
      let x, z;
      if (Math.random() < .32) {
        const a = Math.floor(Math.random() * 6) * Math.PI / 3 + .3;
        const s = Math.pow(Math.random(), .6);
        const r = treeH * .05 + s * baseR * 1.7;
        x = Math.cos(a + s * .5) * r; z = Math.sin(a + s * .5) * r;
      } else {
        const a = Math.random() * Math.PI * 2;
        const r = treeH * .06 + Math.pow(Math.random(), .7) * baseR * 1.75;
        x = Math.cos(a) * r; z = Math.sin(a) * r;
      }
      addParticle({ x, y: treeH * .5 + Math.random() * treeH * .045, z }, {
        color: Math.random() < .14 ? palette.gold : (Math.random() < .6 ? palette.green : palette.teal),
        size: .7 + Math.random() * .55, alpha: .55
      });
    }

    // 数量校准：向叶簇补充微粒至目标数量
    while (particles.length < count && canopyTips.length) {
      const tip = canopyTips[Math.floor(Math.random() * canopyTips.length)];
      const rx = treeH * .06;
      addParticle({
        x: tip.x + (Math.random() - .5) * rx * 2,
        y: tip.y + (Math.random() - .5) * rx * 1.2,
        z: tip.z + (Math.random() - .5) * rx * 2
      }, { color: leafColor(), size: .85 + Math.random() * .5, alpha: .85 });
    }

    // 6) 空气中缓缓上浮的细小光尘
    motes = Array.from({ length: W < 600 ? 16 : 34 }, () => ({
      x: (Math.random() - .5) * treeH * 1.7,
      y: Math.random() * treeH * 1.15 - treeH * .55,
      z: (Math.random() - .5) * treeH * 1.3,
      r: .4 + Math.random() * .8, sp: 7 + Math.random() * 12,
      tw: Math.random() * Math.PI * 2, sway: Math.random() * Math.PI * 2
    }));

    renderPhotoChips();
  }

  function project(x, y, z, cosR, sinR) {
    const rx = x * cosR + z * sinR;
    const rz = -x * sinR + z * cosR;
    const pitch = .11;
    const py = y * Math.cos(pitch) - rz * Math.sin(pitch);
    const pz = y * Math.sin(pitch) + rz * Math.cos(pitch);
    const f = focal / state.zoom;
    const sc = f / (f + pz);
    return { sx: cx + rx * sc, sy: cy + py * sc, sc };
  }

  function setMode(mode, force = false) {
    const now = performance.now();
    if (!force && now - state.lastModeTime < 250) return;
    if (mode === "FOCUS" && !state.shownPhotos.length) {
      showToast("请先到「山野足迹」添加一张徒步照片");
      return;
    }
    state.mode = mode;
    state.lastModeTime = now;
    document.querySelectorAll("[data-mode]").forEach(button => button.classList.toggle("active", button.dataset.mode === mode));
    $("focusCard").hidden = mode !== "FOCUS";
    $("photoLayer").hidden = mode === "FOCUS";
    if (mode === "FOCUS") renderFocus();
    else $("focusVideo").pause();
    if (!state.gestureActive) {
      const tripTag = state.tripTitle ? ` · ${state.tripTitle}` : "";
      $("status").textContent = (mode === "TREE" ? "树形模式 · 鼠标与触控可用" :
        mode === "SCATTER" ? "星野模式 · 拖拽旋转视角" : "照片聚焦模式 · 左右切换回忆") + tripTag;
    }
  }

  function renderFocus() {
    const memory = state.shownPhotos[state.focusIndex % Math.max(state.shownPhotos.length, 1)];
    if (!memory) return;
    const video = $("focusVideo");
    const isVideo = isVideoMemory(memory);
    if (isVideo) {
      video.src = memory.src;
      video.hidden = false;
      video.play().catch(() => { /* 浏览器拦截时保留 controls 手动播放 */ });
    } else {
      video.pause(); video.removeAttribute("src"); video.load();
      video.hidden = true;
      $("focusImage").src = memory.src;
    }
    $("focusImage").hidden = isVideo;
    $("focusImage").alt = memory.title;
    $("focusDate").textContent = formatDate(memory.date);
    $("focusTitle").textContent = memory.title;
    $("focusPlace").textContent = memory.location || "山野之间";
    $("focusNote").textContent = memory.note || quoteFor(memory);
    $("focusRoute").textContent = memory.distance || "路线与距离未记录";
  }

  function drawBackground() {
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);
  }

  // 远处朦胧的山林剪影：两层山脊 + 山腰柔和雾光，压低亮度不抢前景
  function ridgeY(x, seed) {
    return Math.sin(x * .004 + seed) * 24 + Math.sin(x * .0113 + seed * 2.7) * 13 + Math.sin(x * .027 + seed * 1.3) * 5;
  }
  function drawMountains() {
    const horizon = H * .74;
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    // 远山：青蓝雾霭中的浅剪影
    ctx.beginPath();
    ctx.moveTo(-4, H + 4);
    for (let x = -4; x <= W + 4; x += 8) ctx.lineTo(x, horizon - 34 + ridgeY(x, 1.7));
    ctx.lineTo(W + 4, H + 4);
    ctx.closePath();
    ctx.fillStyle = "rgba(42,62,74,.38)";
    ctx.fill();
    // 近山：沉静的深色剪影
    ctx.beginPath();
    ctx.moveTo(-4, H + 4);
    for (let x = -4; x <= W + 4; x += 8) ctx.lineTo(x, horizon + 12 + ridgeY(x, 4.2) * 1.2);
    ctx.lineTo(W + 4, H + 4);
    ctx.closePath();
    ctx.fillStyle = "rgba(7,16,15,.85)";
    ctx.fill();
    // 山脊间柔和雾光
    ctx.globalCompositeOperation = "lighter";
    const mist = ctx.createRadialGradient(cx, horizon, 0, cx, horizon, W * .58);
    mist.addColorStop(0, "rgba(96,142,152,.09)");
    mist.addColorStop(1, "rgba(96,142,152,0)");
    ctx.fillStyle = mist;
    ctx.fillRect(0, horizon - 140, W, 300);
  }

  function drawStars(now) {
    ctx.globalCompositeOperation = "lighter";
    const sprite = makeSprite(palette.ice);
    bgStars.forEach(star => {
      const alpha = star.alpha * (.55 + .45 * Math.sin(star.tw + now * .0012 * star.sp));
      const size = star.r * 9;
      ctx.globalAlpha = alpha;
      ctx.drawImage(sprite, star.x - size / 2, star.y - size / 2, size, size);
    });
  }

  function drawFloor() {
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = .85;
    ctx.save();
    ctx.translate(cx, cy + treeH * .5);
    ctx.scale(1, .25);
    ctx.fillStyle = floorGrad;
    ctx.beginPath();
    ctx.arc(0, 0, baseR * 2.7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawParticles(now, dt) {
    const targetMode = state.mode === "TREE" ? "tree" : "scatter";
    const ease = reduceMotion ? .035 : .025 + Math.min(dt, .05) * .9;
    const cosR = Math.cos(state.rot);
    const sinR = Math.sin(state.rot);
    ctx.globalCompositeOperation = "lighter";
    particles.forEach(particle => {
      const target = particle[targetMode];
      particle.x += (target.x - particle.x) * ease;
      particle.y += (target.y - particle.y) * ease;
      particle.z += (target.z - particle.z) * ease;
      const pr = project(particle.x, particle.y, particle.z, cosR, sinR);
      if (pr.sx < -60 || pr.sx > W + 60 || pr.sy < -60 || pr.sy > H + 60) return;
      let size = particle.size * pr.sc * 5;
      let alpha = particle.alpha;
      if (particle.light) {
        alpha *= .62 + .38 * Math.sin(particle.tw + now * .0042);
        size *= 1.18;
      } else {
        alpha *= .55 + .45 * pr.sc;
      }
      alpha *= Math.min(1, .35 + pr.sc * .75);
      if (alpha <= .01) return;
      ctx.globalAlpha = Math.min(1, alpha);
      ctx.drawImage(makeSprite(particle.color), pr.sx - size / 2, pr.sy - size / 2, size, size);
    });
  }

  function drawTopper(now) {
    // 树顶灵珠：柔和脉动的青金色光晕，替代圣诞树顶星
    const pulse = .8 + .2 * Math.sin(now * .0026);
    const pr = project(0, -treeH * .47, 0, Math.cos(state.rot), Math.sin(state.rot));
    const size = treeH * .07 * pulse;
    const sprite = makeSprite(palette.sage);
    const halo = makeSprite(palette.teal);
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = .32;
    const haloSize = size * 2.6;
    ctx.drawImage(halo, pr.sx - haloSize / 2, pr.sy - haloSize / 2, haloSize, haloSize);
    ctx.globalAlpha = .85;
    ctx.drawImage(sprite, pr.sx - size / 2, pr.sy - size / 2, size, size);
    ctx.save();
    ctx.translate(pr.sx, pr.sy);
    ctx.globalAlpha = .22;
    ctx.scale(.5, 4.6);
    ctx.drawImage(sprite, -size / 2, -size / 2, size, size);
    ctx.restore();
  }

  function burst(x, y, count = 70) {
    const colors = [palette.gold, palette.warm, palette.sage, palette.ice, palette.red];
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 40 + Math.random() * 220;
      sparks.push({
        x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 35,
        life: 0, max: .8 + Math.random() * 1.1, r: 1 + Math.random() * 2.2,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }
  }

  function drawSparks(dt) {
    if (!sparks.length) return;
    ctx.globalCompositeOperation = "lighter";
    for (let i = sparks.length - 1; i >= 0; i--) {
      const spark = sparks[i];
      spark.life += dt;
      if (spark.life >= spark.max) { sparks.splice(i, 1); continue; }
      spark.vy += 110 * dt;
      spark.vx *= .96; spark.vy *= .96;
      spark.x += spark.vx * dt; spark.y += spark.vy * dt;
      const k = 1 - spark.life / spark.max;
      const size = spark.r * 8 * (.35 + k * .9);
      ctx.globalAlpha = Math.max(0, k * 1.05);
      ctx.drawImage(makeSprite(spark.color), spark.x - size / 2, spark.y - size / 2, size, size);
    }
  }

  function drawMotes(dt, now) {
    // 空气中缓缓上浮的细小光尘，舒缓轻盈
    if (!motes.length) return;
    ctx.globalCompositeOperation = "lighter";
    const sprite = makeSprite(palette.ice);
    const cosR = Math.cos(state.rot);
    const sinR = Math.sin(state.rot);
    motes.forEach(mote => {
      mote.y -= mote.sp * dt;
      if (mote.y < -treeH * .58) {
        mote.y = treeH * .55;
        mote.x = (Math.random() - .5) * treeH * 1.7;
        mote.z = (Math.random() - .5) * treeH * 1.3;
      }
      const swayX = mote.x + Math.sin(now * .0006 + mote.sway) * treeH * .012;
      const pr = project(swayX, mote.y, mote.z, cosR, sinR);
      if (pr.sx < -30 || pr.sx > W + 30 || pr.sy < -30 || pr.sy > H + 30) return;
      const alpha = (.16 + .3 * (.5 + .5 * Math.sin(now * .001 + mote.tw))) * Math.min(1, .3 + pr.sc * .7);
      if (alpha <= .02) return;
      const size = mote.r * 8 * pr.sc;
      ctx.globalAlpha = alpha;
      ctx.drawImage(sprite, pr.sx - size / 2, pr.sy - size / 2, size, size);
    });
  }

  function drawVignette() {
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, W, H);
  }

  function updatePhotoChips() {
    if (state.mode === "FOCUS" || !state.photoPositions.length) return;
    const cosR = Math.cos(state.rot);
    const sinR = Math.sin(state.rot);
    const children = $("photoLayer").children;
    state.photoScreenXs = [];
    for (let i = 0; i < children.length; i++) {
      const target = state.photoPositions[i][state.mode === "TREE" ? "tree" : "scatter"];
      const pr = project(target.x, target.y, target.z, cosR, sinR);
      state.photoScreenXs.push(pr.sx);
      const baseSize = Math.max(44, Math.min(70, treeH * .095));
      // 照片多时整体略微缩小，保持透气感
      const density = Math.max(.74, 1 - Math.max(0, state.shownPhotos.length - 8) * .035);
      const size = baseSize * density * Math.max(.72, Math.min(1.14, pr.sc)) * (state.photoPositions[i].sizeFactor || 1);
      const visible = pr.sx > -size && pr.sx < W + size && pr.sy > -size && pr.sy < H + size;
      const element = children[i];
      element.style.left = pr.sx + "px";
      element.style.top = pr.sy + "px";
      element.style.width = size + "px";
      element.style.opacity = visible ? ".97" : "0";
      element.style.pointerEvents = visible ? "auto" : "none";
      element.style.zIndex = String(100 + Math.round(pr.sc * 100));
      element.style.transform = `translate(-50%, -50%) rotate(${i % 2 ? 3 : -3}deg)`;
    }
  }

  function frame(now) {
    if (!frame.last) frame.last = now;
    const dt = Math.min((now - frame.last) / 1000, .05);
    frame.last = now;
    if (!reduceMotion) state.rot += dt * .02;
    state.rot += state.rotationVelocity * dt;
    state.rotationVelocity *= .96;

    drawBackground();
    drawMountains();
    drawStars(now);
    drawFloor();
    drawParticles(now, dt);
    drawTopper(now);
    drawSparks(dt);
    drawMotes(dt, now);
    drawVignette();
    updatePhotoChips();
    requestAnimationFrame(frame);
  }

  document.querySelectorAll("[data-mode]").forEach(button => button.addEventListener("click", () => setMode(button.dataset.mode, true)));
  $("focusClose").addEventListener("click", () => setMode("TREE", true));
  $("focusPrevious").addEventListener("click", () => {
    if (!state.shownPhotos.length) return;
    state.focusIndex = (state.focusIndex - 1 + state.shownPhotos.length) % state.shownPhotos.length;
    renderFocus();
    burst(W / 2, H / 2, 24);
  });
  $("focusNext").addEventListener("click", () => {
    if (!state.shownPhotos.length) return;
    state.focusIndex = (state.focusIndex + 1) % state.shownPhotos.length;
    renderFocus();
    burst(W / 2, H / 2, 24);
  });

  canvas.addEventListener("pointerdown", event => {
    state.dragging = true;
    state.lastPointerX = event.clientX;
    burst(event.clientX, event.clientY, reduceMotion ? 20 : 48);
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener("pointermove", event => {
    if (!state.dragging) return;
    const dx = event.clientX - state.lastPointerX;
    state.lastPointerX = event.clientX;
    state.rotationVelocity = dx * .06;
  });
  canvas.addEventListener("pointerup", event => {
    state.dragging = false;
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
  });
  canvas.addEventListener("pointercancel", () => { state.dragging = false; });
  canvas.addEventListener("wheel", event => {
    event.preventDefault();
    state.zoom = Math.max(.72, Math.min(1.45, state.zoom - event.deltaY * .001));
  }, { passive: false });
  window.addEventListener("resize", buildScene);
  document.addEventListener("keydown", event => {
    if (event.key === "1") setMode("TREE", true);
    if (event.key === "2") setMode("SCATTER", true);
    if (event.key === "3") setMode("FOCUS", true);
    if (event.key === "h" || event.key === "H") {
      state.interfaceHidden = !state.interfaceHidden;
      ["topbar", "hint", "status"].forEach(id => { $(id).hidden = state.interfaceHidden; });
    }
    if (event.key === "Escape" && state.mode === "FOCUS") setMode("TREE", true);
  });

  async function initGesture() {
    const button = $("gestureButton");
    button.disabled = true;
    $("status").textContent = "正在加载手势模型...";
    const sources = [
      { bundle: "./vendor/mediapipe/vision_bundle.mjs", wasm: "./vendor/mediapipe/wasm", model: "./vendor/mediapipe/gesture_recognizer.task" },
      { bundle: "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs", wasm: "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm", model: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task" },
      { bundle: "https://unpkg.com/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs", wasm: "https://unpkg.com/@mediapipe/tasks-vision@0.10.14/wasm", model: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task" }
    ];
    let lastError = null;
    for (const source of sources) {
      try {
        const { FilesetResolver, GestureRecognizer } = await import(source.bundle);
        const vision = await FilesetResolver.forVisionTasks(source.wasm);
        const options = delegate => ({
          baseOptions: { modelAssetPath: source.model, delegate },
          runningMode: "VIDEO", numHands: 1
        });
        try {
          state.gestureRecognizer = await GestureRecognizer.createFromOptions(vision, options("GPU"));
        } catch (error) {
          state.gestureRecognizer = await GestureRecognizer.createFromOptions(vision, options("CPU"));
        }
        lastError = null;
        break;
      } catch (error) {
        lastError = error;
      }
    }
    if (lastError) throw lastError;
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("摄像头 API 不可用");
      state.stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false
      });
      const video = $("webcam");
      video.srcObject = state.stream;
      video.hidden = false;
      await video.play();
      state.gestureActive = true;
      button.textContent = "关闭手势";
      $("status").textContent = "手势控制已开启";
      showToast("握拳聚拢，张手散开，食指向上聚焦照片");
      predictGesture();
    } catch (error) {
      console.warn("Gesture mode unavailable:", error);
      $("status").textContent = "手势不可用，已保留鼠标与触控模式";
      showToast("手势模型或摄像头未启用，仍可用按钮、鼠标和触控控制", 4800);
      await stopGesture(false);
    } finally {
      button.disabled = false;
    }
  }

  async function stopGesture(showStatus = true) {
    state.gestureActive = false;
    if (state.stream) {
      state.stream.getTracks().forEach(track => track.stop());
      state.stream = null;
    }
    const video = $("webcam");
    video.pause();
    video.srcObject = null;
    video.hidden = true;
    $("handCursor").hidden = true;
    $("gestureButton").textContent = "启用手势";
    if (state.gestureRecognizer && typeof state.gestureRecognizer.close === "function") {
      try { state.gestureRecognizer.close(); } catch (error) { /* already closed */ }
    }
    state.gestureRecognizer = null;
    if (showStatus) $("status").textContent = "鼠标与触控模式";
  }

  function nearestPhotoIndex(handX) {
    const xs = state.photoScreenXs || [];
    if (!xs.length || !state.shownPhotos.length) return 0;
    let best = 0, bestDist = Infinity;
    xs.forEach((x, i) => {
      const d = Math.abs(x - handX * W);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    return best;
  }

  function predictGesture() {
    if (!state.gestureActive || !state.gestureRecognizer) return;
    const video = $("webcam");
    const now = performance.now();
    if (video.currentTime !== state.lastVideoTime && video.readyState >= 2) {
      state.lastVideoTime = video.currentTime;
      const results = state.gestureRecognizer.recognizeForVideo(video, now);
      const landmarks = results.landmarks && results.landmarks[0];
      const cursor = $("handCursor");
      if (landmarks && landmarks[9]) {
        const palm = landmarks[9];
        cursor.hidden = false;
        cursor.style.left = palm.x * W + "px";
        cursor.style.top = palm.y * H + "px";
        state.rotationVelocity = (palm.x - .5) * 1.4;
      } else {
        cursor.hidden = true;
        state.rotationVelocity *= .4;
      }
      const gesture = results.gestures && results.gestures[0] && results.gestures[0][0] ? results.gestures[0][0].categoryName : "";
      if (gesture === state.lastGesture) state.gestureCounter++;
      else { state.gestureCounter = 0; state.lastGesture = gesture; }
      const handX = landmarks && landmarks[9] ? landmarks[9].x : null;
      // 手部水平轨迹（最近 420ms），用于挥动方向检测
      if (handX != null) {
        state.handTrail.push({ x: handX, t: now });
        while (state.handTrail.length && now - state.handTrail[0].t > 420) state.handTrail.shift();
        // 手回到中间区域后重新武装，避免一次挥动连切多张
        if (handX > .40 && handX < .60) state.swipeArmed = true;
      } else {
        state.handTrail = [];
        state.swipeArmed = true;
      }
      const modeMap = { Closed_Fist: "TREE", Open_Palm: "SCATTER", Pointing_Up: "FOCUS" };
      const mapped = modeMap[gesture];
      if (mapped && state.gestureCounter >= 4 && mapped !== state.mode && now - state.lastModeTime > 900) {
        if (mapped === "FOCUS" && state.shownPhotos.length) state.focusIndex = (state.focusIndex + 1) % state.shownPhotos.length;
        setMode(mapped, true);
        state.lastModeTime = now;
        state.handTrail = [];
        state.lastGestureSwitch = now;
      }
      // ✌️ 剪刀手：2 帧即可锁定最近照片并放大（原需 3 帧，容易因识别抖动失效）
      if (gesture === "Victory" && state.gestureCounter >= 2) {
        if (state.mode !== "FOCUS" && state.shownPhotos.length) {
          state.focusIndex = nearestPhotoIndex(handX == null ? .5 : handX);
          setMode("FOCUS", true);
          state.lastGestureSwitch = now;
          state.handTrail = [];
          state.swipeArmed = false;
          burst(W / 2, H / 2, 30);
          showToast("✌️ 已放大这张回忆：左右挥手切换，握拳返回树形");
        }
      }
      // 聚焦模式下的左右切换：挥动方向优先，边缘位置兜底；手势识别短暂丢失（None/空）也能切
      if (state.mode === "FOCUS" && handX != null && state.shownPhotos.length &&
          state.swipeArmed && now - state.lastGestureSwitch > 600 &&
          gesture !== "Open_Palm" && gesture !== "Closed_Fist" && gesture !== "Pointing_Up") {
        let direction = 0;
        const trail = state.handTrail;
        if (trail.length >= 2) {
          const dx = handX - trail[0].x;
          if (dx <= -.12) direction = -1;
          else if (dx >= .12) direction = 1;
        }
        if (!direction) {
          if (handX < .32) direction = -1;
          else if (handX > .68) direction = 1;
        }
        if (direction) {
          state.focusIndex = (state.focusIndex + direction + state.shownPhotos.length) % state.shownPhotos.length;
          renderFocus();
          burst(W / 2, H / 2, 20);
          state.lastGestureSwitch = now;
          state.handTrail = [];
          state.swipeArmed = false;
        }
      }
      if (["ILoveYou", "Thumb_Up"].includes(gesture) && now - state.lastEffectTime > 2200) {
        state.lastEffectTime = now;
        burst(W * (.35 + Math.random() * .3), H * (.35 + Math.random() * .25), gesture === "ILoveYou" ? 110 : 65);
      }
      if (gesture) $("status").textContent = "识别到：" + gesture.replaceAll("_", " ");
    }
    requestAnimationFrame(predictGesture);
  }

  // ---------- 背景音乐（Episode 33 · 本地文件循环播放） ----------
  const bgm = $("bgm");
  bgm.volume = .6;
  bgm.addEventListener("play", () => {
    $("musicButton").textContent = "暂停音乐";
    $("musicButton").classList.add("active");
  });
  bgm.addEventListener("pause", () => {
    $("musicButton").textContent = "播放音乐";
    $("musicButton").classList.remove("active");
  });
  bgm.addEventListener("error", () => showToast("音乐文件加载失败，请确认 music/episode33.mp3 存在", 5000));
  $("musicButton").addEventListener("click", async () => {
    try {
      if (bgm.paused) { await bgm.play(); showToast("背景音乐：Episode 33 · 循环播放"); }
      else bgm.pause();
    } catch (error) {
      showToast("音频启动失败：" + error.message);
    }
  });

  // ---------- 进入页面自动播放（浏览器可能拦截有声自动播放，被拦截时首次点击/触摸即启动） ----------
  function tryAutoPlay() {
    bgm.play().then(() => {
      showToast("背景音乐：Episode 33 · 循环播放");
    }).catch(() => {
      const kick = () => {
        bgm.play().then(() => showToast("背景音乐：Episode 33 · 循环播放")).catch(() => {});
        document.removeEventListener("pointerdown", kick);
        document.removeEventListener("keydown", kick);
      };
      document.addEventListener("pointerdown", kick);
      document.addEventListener("keydown", kick);
      showToast("点击页面任意处即可开始播放音乐", 4200);
    });
  }
  tryAutoPlay();

  $("gestureButton").addEventListener("click", async () => {
    if (state.gestureActive) await stopGesture();
    else await initGesture();
  });

  buildScene();
  loadPhotos();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
